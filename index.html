<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompt 最小实践 Demo | 交易风险摘要</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">AI x Web3 School / Prompt</p>
        <h1>交易风险摘要 Prompt Lab</h1>
      </div>
      <a class="source-link" href="https://aiweb3.school/zh/handbook/ai/prompt/" target="_blank" rel="noreferrer">原文</a>
    </header>

    <main class="layout">
      <section class="intro band">
        <div>
          <h2>Demo 目标</h2>
          <p>
            把“帮我看看这笔交易有没有问题”改写成可执行的 Prompt 协议：
            明确输入边界、禁止行为、固定 JSON 输出，并用代码检查高风险动作。
          </p>
        </div>
        <ol class="flow">
          <li>Prompt 定义任务</li>
          <li>Model 生成摘要</li>
          <li>Code 校验结构</li>
          <li>Guard 标记风险</li>
          <li>Human check 确认</li>
        </ol>
      </section>

      <section class="workspace">
        <aside class="panel controls">
          <h2>交易输入</h2>

          <label class="field">
            <span>交易描述模板</span>
            <textarea id="transactionTemplate" rows="14" spellcheck="false"></textarea>
          </label>

          <button id="runButton" class="primary" type="button">生成并校验</button>
        </aside>

        <section class="panel result-panel">
          <div class="panel-heading">
            <h2>结构化输出</h2>
            <span id="riskBadge" class="badge"></span>
          </div>
          <div id="caseResult" class="case-result"></div>
          <pre id="jsonOutput" class="codeblock"></pre>
        </section>

        <section class="panel checklist-panel">
          <h2>代码层校验</h2>
          <div id="checks" class="checks"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
